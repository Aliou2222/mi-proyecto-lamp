<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Formulario Alumno</title>
</head>
<body>
  <h2>Datos del Alumno</h2>
  <form action="registro.php" method="POST">
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" required><br><br>

    <label for="apellidos">Apellidos:</label>
    <input type="text" id="apellidos" name="apellidos" required><br><br>

    <label for="curso">Curso académico:</label>
    <select id="curso" multiple size="2" name="curso[]">
    <!-- <select id="curso" name="curso"> -->
      <option value="1º ESO">1º ESO</option>
      <option value="2º ESO">2º ESO</option>
      <option value="3º ESO">3º ESO</option>
      <option value="4º ESO">4º ESO</option>
      <option value="1º Bachillerato">1º Bachillerato</option>
      <option value="2º Bachillerato">2º Bachillerato</option>
      <option value="CFGM">CFGM</option>
      <option value="CFGS">CFGS</option>
    </select>
    <br><br>

    <label for="clave">Contraseña:</label>
    <input type="password" id="clave" name="clave" required><br><br>

    <span>Sexo:</span>
    <input type="radio" id="masculino" name="sexo" value="Masculino" required>
    <label for="masculino">Masculino</label>
    <input type="radio" id="femenino" name="sexo" value="Femenino">
    <label for="femenino">Femenino</label>
    <br><br>

    <span>Idiomas:</span>
    <input type="checkbox" id="castellano" name="idiomas[]" value="Castellano">
    <label for="castellano">Castellano</label>
    <input type="checkbox" id="ingles" name="idiomas[]" value="Inglés">
    <label for="ingles">Inglés</label>
    <input type="checkbox" id="frances" name="idiomas[]" value="Francés">
    <label for="frances">Francés</label>
    <input type="checkbox" id="valenciano" name="idiomas[]" value="Valenciano">
    <label for="valenciano">Valenciano</label>
    <br><br>

    <label for="comentarios">Comentarios:</label><br>
    <textarea id="comentarios" name="comentarios" rows="4" cols="50"></textarea>
    <br><br>

     <label for="teléfono">Teléfono:</label><br>
    <textarea id="telefono" name="telefono" rows="4" cols="50"></textarea>
    <br><br>

    <input type="submit" value="Enviar">
  </form>
</body>
</html>
